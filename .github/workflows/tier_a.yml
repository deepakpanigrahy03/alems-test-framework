name: Tier A — Logic Tests

on:
  pull_request:
    branches: [main]

jobs:
  tier-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tier A
        run: pytest checks/tier_a/ -v --tb=short
